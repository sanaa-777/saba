name: Fetch Awtar News Automatically
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
concurrency:
  group: awtar-news-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch RSS, websites and Telegram sources in safe batches
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          : "${SUPABASE_URL:?Missing SUPABASE_URL secret}"
          : "${CRON_SECRET:?Missing CRON_SECRET secret}"
          for OFFSET in 0 12 24 36 48 60; do
            echo "Fetching source batch offset=${OFFSET}"
            curl --fail-with-body --retry 2 --retry-delay 5 --max-time 110 \
              -H "x-cron-secret: ${CRON_SECRET}" \
              -H "Accept: application/json" \
              "${SUPABASE_URL}/functions/v1/awtar-api/cron/fetch-news?offset=${OFFSET}&limit=12"
          done
