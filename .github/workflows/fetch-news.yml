name: Fetch Awtar News Automatically

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awtar-news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - name: Install feed parser dependencies
        run: python -m pip install --disable-pip-version-check --no-input beautifulsoup4 lxml

      - name: Fetch RSS feeds and update Firebase static data
        run: python scripts/auto_refresh_firebase.py

      - name: Commit and push updated news
        run: |
          git config user.name 'Awtar News Automation'
          git config user.email 'automation@awtar-news.local'
          git add firebase-dist/data firebase-dist/images/news
          if git diff --cached --quiet; then
            echo 'No news changes to commit.'
            exit 0
          fi
          git commit -m "chore: refresh news feed"
          git push

      - name: Deploy refreshed static site to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo 'Firebase deploy skipped: add FIREBASE_TOKEN and FIREBASE_PROJECT_ID repository secrets.'
            exit 0
          fi
          npx --yes firebase-tools deploy --only hosting --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN"
